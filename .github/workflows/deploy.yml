name: Deploy to GitHub Pages

# 로컬에서 스크랩 → gen → 커밋/푸시하면, CI는 빌드+배포만 (스크래핑은 CI에서 안 함)
# 배포: dist를 gh-pages 브랜치에 푸시 (deploy-pages API가 이 레포에서 계속 실패해 우회)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # gh-pages 브랜치에 푸시하려면 필요

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build (Pages base 주입)
        working-directory: web
        run: npm run build
        env:
          PAGES_BASE: /price-comparison/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          # .nojekyll 자동 추가(기본) → 정적 파일 그대로 서빙
